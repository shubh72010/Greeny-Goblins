name: Release — auto on main
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      release_tag: ${{ steps.check_version.outputs.release_tag }}
      short_sha: ${{ steps.check_version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Check version and Tag
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "Error: app/build.gradle.kts does not exist"
            exit 1
          fi

          # 1. Extract the version from Gradle (using your regex)
          NEW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          
          if [ -z "$NEW_VERSION" ]; then
            echo "Error: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          # 2. ALWAYS Output the detected version (Fixes the missing output bug)
          echo "Detected version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # 3. Always release on push to main — make tag unique per commit if version tag already exists
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            TAG="v$NEW_VERSION-$SHORT_SHA"
            echo "Tag v$NEW_VERSION already exists → using $TAG for this commit."
          else
            TAG="v$NEW_VERSION"
            echo "Tag $TAG does not exist → using $TAG."
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_changed=true" >> "$GITHUB_OUTPUT"

      - name: Debug output
        run: |
          echo "version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "new_version: ${{ steps.check_version.outputs.new_version }}"

  build:
    name: Build Release APK (GmsMobileUniversal)
    needs: [check-version]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          echo "distribution=gms" >> "$GITHUB_OUTPUT"
          echo "distribution_cap=Gms" >> "$GITHUB_OUTPUT"
          echo "device=mobile" >> "$GITHUB_OUTPUT"
          echo "abi=universal" >> "$GITHUB_OUTPUT"
          echo "device_cap=Mobile" >> "$GITHUB_OUTPUT"
          echo "abi_cap=Universal" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assembleGmsMobileUniversalRelease" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-gms-mobile-universal-release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-gms-mobile-universal-release.apk" >> "$GITHUB_OUTPUT"
  
      - name: Build Release APK
        run: ./gradlew assembleGmsMobileUniversalRelease
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${ABI}/${DEVICE}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Sign APK
        continue-on-error: true
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0
      
      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          # Prefer signed APK if signing ran, otherwise fallback to unsigned
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -eq 1 ]; then
            APK="${SIGNED_APKS[0]}"
            mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"
            exit 0
          fi
          # Fallback: unsigned APK (when KEYSTORE secret not set)
          mapfile -t UNSIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed.apk" ! -name "*-unsigned-signed.apk"
          )
          if [ "${#UNSIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected one APK in $RELEASE_DIR (signed or unsigned), found signed=${#SIGNED_APKS[@]} unsigned=${#UNSIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${UNSIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"
  
      - name: VirusTotal scan (gate release on detections)
        if: env.VIRUSTOTAL_API_KEY != ''
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}"
          echo "VirusTotal scan for $APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "SHA256: $SHA"
          # Lookup existing report by hash
          HTTP=$(curl -s -w "%{http_code}" -o /tmp/vt_report.json --header "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/files/$SHA" || true)
          if echo "$HTTP" | grep -q "200"; then
            DETECT=$(python3 -c "import json; d=json.load(open('/tmp/vt_report.json')); print(d.get('data',{}).get('attributes',{}).get('last_analysis_stats',{}).get('malicious',0))" 2>/dev/null || echo "?")
            echo "VirusTotal detections: $DETECT"
            echo "### VirusTotal — $DETECT detections" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DETECT" != "0" ] && [ "$DETECT" != "?" ]; then echo "::error::VirusTotal flagged $DETECT detections — gating release"; exit 1; fi
          else
            echo "No prior report (HTTP $HTTP), uploading for scan..."
            UPLOAD_JSON=$(curl -s --header "x-apikey: $VIRUSTOTAL_API_KEY" --form "file=@$APK" https://www.virustotal.com/api/v3/files || true)
            echo "$UPLOAD_JSON" | head -c 500
            echo "Uploaded to VirusTotal — check https://www.virustotal.com/gui/file/$SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Resolve changelog range
        id: changelog_range
        shell: bash
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            FROM_REF="$LAST_TAG"
          else
            FROM_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "from_ref=$FROM_REF" >> "$GITHUB_OUTPUT"
          echo "to_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.changelog_range.outputs.from_ref }}
          toTag: ${{ steps.changelog_range.outputs.to_ref }}
          configurationJson: |
            {
              "template": "# Changelog\n\n#{{CHANGELOG}}\n\n<details>\n<summary>Other changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n",
              "pr_template": "- #{{TITLE}} — by @#{{AUTHOR}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Performance", "labels": ["perf"] },
                { "title": "## Refactors", "labels": ["refactor"] },
                { "title": "## Documentation", "labels": ["docs"] },
                { "title": "## Build / CI", "labels": ["build", "ci"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?:\\s+.*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find downloaded_artifacts -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then echo "No APK found"; find downloaded_artifacts -type f | head -20; exit 1; fi
          echo "Releasing $APK"
          cat > release_notes.md <<EOF
          ${{ steps.build_changelog.outputs.changelog }}
          EOF
          TAG="${{ needs.check-version.outputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${{ needs.check-version.outputs.new_version }}-${GITHUB_SHA::7}"; fi
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes-file release_notes.md "$APK"
