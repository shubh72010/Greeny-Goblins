name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Fix gradle.properties for Linux
        run: |
          if grep -q "org.gradle.java.home" gradle.properties; then
            echo "Removing hardcoded Windows java.home from gradle.properties"
            sed -i '/org.gradle.java.home/d' gradle.properties
            cat gradle.properties
          fi

      - name: Decode release keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding real release keystore..."
            mkdir -p app/keystore
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
            cp app/keystore/release.keystore app/release.keystore 2>/dev/null || true
            cp app/keystore/release.keystore app/jusnotes-release.jks 2>/dev/null || true
            ls -lh app/keystore/release.keystore app/release.keystore app/jusnotes-release.jks 2>&1 | head -n 10
          elif [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "Decoding KEYSTORE (legacy) -> app/keystore/release.keystore"
            mkdir -p app/keystore
            echo "${{ secrets.KEYSTORE }}" | base64 -d > app/keystore/release.keystore
            cp app/keystore/release.keystore app/release.keystore 2>/dev/null || true
            ls -lh app/keystore/release.keystore
          else
            echo "No base64 secret - using checked-in app/keystore/release.keystore (or debug fallback)"
            ls -lh app/keystore/release.keystore 2>&1 | head -n 5 || echo "no keystore file"
            if [ ! -f app/keystore/release.keystore ] && [ ! -f app/release.keystore ]; then
              mkdir -p ~/.android
              if [ ! -f ~/.android/debug.keystore ]; then
                keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              fi
              ls -lh ~/.android/debug.keystore
            fi
          fi

      - name: Run tests
        run: ./gradlew test --stacktrace

      - name: Build release APK (GmsMobileUniversal)
        run: ./gradlew assembleGmsMobileUniversalRelease --stacktrace --no-configuration-cache
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          STORE_PASSWORD: maxverstappen
          KEYSTORE_PASSWORD: maxverstappen
          KEY_ALIAS: jusplayer
          KEY_PASSWORD: maxverstappen
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release-unsigned.apk"
          if [ -f "$APK" ]; then
            # Gradle produced unsigned (fallback debug) - check for signed variant
            CANDIDATE="app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk"
            if [ -f "$CANDIDATE" ]; then APK="$CANDIDATE"; fi
          else
            APK="app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk"
          fi
          # Also handle signed suffix from ilharp if present (not used now)
          for f in app/build/outputs/apk/gmsMobileUniversal/release/*.apk; do echo "found $f"; ls -lh "$f"; done
          test -f "app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk" || test -f "app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release-unsigned.apk" || (echo "release APK not found" && find app/build/outputs/apk -name "*.apk" | head -n 20 && exit 1)
          # Normalize to app-release.apk naming for JusNotes-style steps
          mkdir -p app/build/outputs/apk/release
          if [ -f "app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk" ]; then
            cp app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk app/build/outputs/apk/release/app-release.apk
          elif [ -f "app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release-unsigned.apk" ]; then
            # fallback debug signed - still copy
            cp app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
          fi
          ls -lh app/build/outputs/apk/release/

      - name: Verify APK signature
        run: |
          echo "Verifying signature..."
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify app/build/outputs/apk/release/app-release.apk && echo "apksigner verify: OK"
          if $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -q "CN=Android Debug"; then
            echo "::warning::APK is signed with DEBUG keystore — expected release keystore (52:51:69...)"
          fi
          # also copy back to gms path for upload
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk 2>/dev/null || true

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          sha512sum app-release.apk > app-release.apk.sha512
          cat app-release.apk.sha256
          cat app-release.apk.sha512
          ls -lh app-release.apk.*
          # also for gms path
          cp app-release.apk.sha256 app-release.apk.sha512 ../gmsMobileUniversal/release/ 2>/dev/null || true
          # keep gms name
          cd ../gmsMobileUniversal/release
          sha256sum app-gms-mobile-universal-release.apk > app-gms-mobile-universal-release.apk.sha256 2>/dev/null || true
          sha512sum app-gms-mobile-universal-release.apk > app-gms-mobile-universal-release.apk.sha512 2>/dev/null || true

      - name: VirusTotal scan
        id: vt
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set +e
          APK=app/build/outputs/apk/release/app-release.apk
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK SHA256: $SHA256"
          mkdir -p app/build/outputs/apk/release
          VT_SUMMARY="VirusTotal scan skipped (no API key)"
          VT_JSON="{}"
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "No VIRUSTOTAL_API_KEY — skipping scan"
            echo "result=skipped" >> $GITHUB_OUTPUT
            echo "summary=$VT_SUMMARY" >> $GITHUB_OUTPUT
            echo "$VT_SUMMARY" > app/build/outputs/apk/release/virustotal.txt
            echo "$VT_JSON" > app/build/outputs/apk/release/virustotal.json
            echo "$VT_SUMMARY" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "Querying VirusTotal for $SHA256..."
          HTTP_CODE=$(curl -s -o /tmp/vt_file.json -w "%{http_code}" -H "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/files/$SHA256" || true)
          echo "File lookup HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "File already known to VirusTotal"
            cat /tmp/vt_file.json > /tmp/vt_result.json
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "File not known — uploading to VirusTotal..."
            UPLOAD_CODE=$(curl -s -o /tmp/vt_upload.json -w "%{http_code}" -H "x-apikey: $VIRUSTOTAL_API_KEY" -F "file=@$APK" "https://www.virustotal.com/api/v3/files" || true)
            echo "Upload HTTP: $UPLOAD_CODE"
            cat /tmp/vt_upload.json | head -n 50
            if [ "$UPLOAD_CODE" = "200" ]; then
              ANALYSIS_ID=$(python3 -c "import json; print(json.load(open('/tmp/vt_upload.json'))['data']['id'])" 2>/dev/null || echo "")
              if [ -n "$ANALYSIS_ID" ]; then
                echo "Polling analysis $ANALYSIS_ID..."
                for i in 1 2 3 4 5 6; do
                  sleep 10
                  ACODE=$(curl -s -o /tmp/vt_analysis.json -w "%{http_code}" -H "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" || true)
                  STATUS=$(python3 -c "import json; print(json.load(open('/tmp/vt_analysis.json'))['data']['attributes']['status'])" 2>/dev/null || echo "unknown")
                  echo "Attempt $i: status=$STATUS code=$ACODE"
                  if [ "$STATUS" = "completed" ]; then
                    curl -s -H "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/files/$SHA256" -o /tmp/vt_file.json || true
                    cat /tmp/vt_file.json > /tmp/vt_result.json
                    break
                  fi
                done
              fi
            else
              echo "Upload failed ($UPLOAD_CODE)"
              VT_SUMMARY="VirusTotal scan of app-release.apk — upload failed (HTTP $UPLOAD_CODE, key/quota?)"
              echo "result=failed" >> $GITHUB_OUTPUT
              echo "summary=$VT_SUMMARY" >> $GITHUB_OUTPUT
              echo "$VT_SUMMARY" > app/build/outputs/apk/release/virustotal.txt
              echo "{\"error\":\"upload failed $UPLOAD_CODE\"}" > app/build/outputs/apk/release/virustotal.json
              echo "$VT_SUMMARY" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            [ -f /tmp/vt_result.json ] || cp /tmp/vt_file.json /tmp/vt_result.json 2>/dev/null || echo "{}" > /tmp/vt_result.json
          elif [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ]; then
            echo "VirusTotal auth failed"
            VT_SUMMARY="VirusTotal scan of app-release.apk — auth failed (invalid key, HTTP $HTTP_CODE)"
            echo "result=auth_failed" >> $GITHUB_OUTPUT
            echo "summary=$VT_SUMMARY" >> $GITHUB_OUTPUT
            echo "$VT_SUMMARY" > app/build/outputs/apk/release/virustotal.txt
            echo "{\"error\":\"auth $HTTP_CODE\"}" > app/build/outputs/apk/release/virustotal.json
            echo "$VT_SUMMARY" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "Unexpected VT response $HTTP_CODE"
            VT_SUMMARY="VirusTotal scan of app-release.apk — API error (HTTP $HTTP_CODE)"
            echo "result=api_error" >> $GITHUB_OUTPUT
            echo "summary=$VT_SUMMARY" >> $GITHUB_OUTPUT
            echo "$VT_SUMMARY" > app/build/outputs/apk/release/virustotal.txt
            echo "{\"error\":\"http $HTTP_CODE\"}" > app/build/outputs/apk/release/virustotal.json
            echo "$VT_SUMMARY" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          if [ -f /tmp/vt_result.json ]; then
            python3 << 'PYEOF' || true
          import json, pathlib
          try:
              d=json.load(open('/tmp/vt_result.json'))
              attrs=d.get('data',{}).get('attributes',{})
              stats=attrs.get('last_analysis_stats',{})
              mal=stats.get('malicious',0)
              sus=stats.get('suspicious',0)
              und=stats.get('undetected',0)
              har=stats.get('harmless',0)
              total=mal+sus+und+har
              sha=attrs.get('sha256') or ''
              if not sha:
                  import hashlib
                  sha=hashlib.sha256(open('app/build/outputs/apk/release/app-release.apk','rb').read()).hexdigest()
              link=f"https://www.virustotal.com/gui/file/{sha}/detection"
              if mal==0 and sus==0:
                  summary=f"VirusTotal scan of app-release.apk — clean (0/{total} detections) — [view on VirusTotal]({link})"
                  result="clean"
              else:
                  summary=f"VirusTotal scan of app-release.apk — {mal} malicious, {sus} suspicious / {total} — [view on VirusTotal]({link})"
                  result="detected" if mal>0 else "suspicious"
              open('app/build/outputs/apk/release/virustotal.txt','w').write(summary+"\n")
              open('/tmp/vt_summary.txt','w').write(summary)
              open('/tmp/vt_result_flag.txt','w').write(result)
          except Exception as e:
              print(f"parse error {e}")
              open('app/build/outputs/apk/release/virustotal.txt','w').write(f"VirusTotal scan of app-release.apk — parse error: {e}\n")
              open('/tmp/vt_result_flag.txt','w').write("parse_error")
          PYEOF
            echo -n "$SHA256" > /tmp/sha.txt
            VT_SUMMARY=$(cat app/build/outputs/apk/release/virustotal.txt 2>/dev/null || echo "VirusTotal scan of app-release.apk — unknown")
            VT_RESULT=$(cat /tmp/vt_result_flag.txt 2>/dev/null || echo "unknown")
            cp /tmp/vt_result.json app/build/outputs/apk/release/virustotal.json 2>/dev/null || echo "{}" > app/build/outputs/apk/release/virustotal.json
          else
            VT_SUMMARY="VirusTotal scan of app-release.apk — no report"
            VT_RESULT="no_report"
            echo "$VT_SUMMARY" > app/build/outputs/apk/release/virustotal.txt
            echo "{}" > app/build/outputs/apk/release/virustotal.json
          fi
          echo "summary=$VT_SUMMARY" >> $GITHUB_OUTPUT
          echo "result=$VT_RESULT" >> $GITHUB_OUTPUT
          echo "$VT_SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "VirusTotal: $VT_SUMMARY (result=$VT_RESULT)"
          if [ "$VT_RESULT" = "detected" ]; then
            echo "::error::VirusTotal flagged APK as malicious — failing release"
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -n 30)
          else
            LOG=$(git log "$LAST_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges | head -n 30)
          fi
          echo "$LOG" > app/build/outputs/apk/release/CHANGELOG.txt
          cat app/build/outputs/apk/release/CHANGELOG.txt
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v14.0.${{ github.run_number }}
          name: v14.0.${{ github.run_number }}
          generate_release_notes: false
          body: |
            **Changelog since ${{ steps.changelog.outputs.last_tag || 'initial' }}:**
            ${{ steps.changelog.outputs.log }}

            **Signature:** `JusPlayer Release (RSA 4096)` — verify with `apksigner verify --print-certs`.
            **Checksums:** see `app-release.apk.sha256` / `.sha512` assets.
            **${{ steps.vt.outputs.summary || 'VirusTotal scan of app-release.apk — pending' }}**

            Built via `assembleGmsMobileUniversalRelease` (R8 + shrinkResources), attested with `actions/attest-build-provenance`.

            > **Note:** Debug APK `moe.rukamori.archivetune.debug` has distinct `applicationId` (.debug suffix) so side-by-side install with release has no conflict.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/apk/release/app-release.apk.sha512
            app/build/outputs/apk/release/virustotal.txt
            app/build/outputs/apk/release/virustotal.json
            app/build/outputs/apk/release/CHANGELOG.txt
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk
            app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk.sha256
            app/build/outputs/apk/gmsMobileUniversal/release/app-gms-mobile-universal-release.apk.sha512
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
