name: Release — auto on main
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
      release_tag: ${{ steps.check_version.outputs.release_tag }}
      short_sha: ${{ steps.check_version.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Check version and Tag
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "Error: app/build.gradle.kts does not exist"
            exit 1
          fi

          # 1. Extract the version from Gradle (using your regex)
          NEW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")
          
          if [ -z "$NEW_VERSION" ]; then
            echo "Error: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          # 2. ALWAYS Output the detected version (Fixes the missing output bug)
          echo "Detected version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # 3. Always release on push to main — make tag unique per commit if version tag already exists
          SHORT_SHA="$(echo "$GITHUB_SHA" | cut -c1-7)"
          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            TAG="v$NEW_VERSION-$SHORT_SHA"
            echo "Tag v$NEW_VERSION already exists → using $TAG for this commit."
          else
            TAG="v$NEW_VERSION"
            echo "Tag $TAG does not exist → using $TAG."
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_changed=true" >> "$GITHUB_OUTPUT"

      - name: Debug output
        run: |
          echo "version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "new_version: ${{ steps.check_version.outputs.new_version }}"

  build:
    name: Build Release APK (GmsMobileUniversal)
    needs: [check-version]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          echo "distribution=gms" >> "$GITHUB_OUTPUT"
          echo "distribution_cap=Gms" >> "$GITHUB_OUTPUT"
          echo "device=mobile" >> "$GITHUB_OUTPUT"
          echo "abi=universal" >> "$GITHUB_OUTPUT"
          echo "device_cap=Mobile" >> "$GITHUB_OUTPUT"
          echo "abi_cap=Universal" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assembleGmsMobileUniversalRelease" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-gms-mobile-universal-release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-gms-mobile-universal-release.apk" >> "$GITHUB_OUTPUT"
  
      - name: Build Release + Debug APKs
        run: ./gradlew assembleGmsMobileUniversalRelease assembleGmsMobileUniversalDebug
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${ABI}/${DEVICE}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Sign APK
        continue-on-error: true
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0
      
      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          # Prefer signed APK if signing ran, otherwise fallback to unsigned
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -eq 1 ]; then
            APK="${SIGNED_APKS[0]}"
            mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"
            exit 0
          fi
          # Fallback: unsigned APK (when KEYSTORE secret not set)
          mapfile -t UNSIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*-signed.apk" ! -name "*-unsigned-signed.apk"
          )
          if [ "${#UNSIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected one APK in $RELEASE_DIR (signed or unsigned), found signed=${#SIGNED_APKS[@]} unsigned=${#UNSIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${UNSIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Resolve debug output directory
        id: debug_dir
        shell: bash
        run: |
          set -euo pipefail
          # reuse variant outputs but with /debug
          for d in "app/build/outputs/apk/gmsMobileUniversal/debug" "app/build/outputs/apk/gms/mobile/universal/debug" "app/build/outputs/apk/mobile/universal/debug"; do
            if [ -d "$d" ]; then echo "debug_dir=$d" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          FOUND=$(find app/build/outputs/apk -type f -path "*/debug/*.apk" | head -n1 | xargs -r dirname || true)
          if [ -n "$FOUND" ]; then echo "debug_dir=$FOUND" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "debug_dir=app/build/outputs/apk/gmsMobileUniversal/debug" >> "$GITHUB_OUTPUT"

      - name: Move Debug APK
        shell: bash
        run: |
          set -euo pipefail
          DEBUG_DIR="${{ steps.debug_dir.outputs.debug_dir }}"
          # ensure release out dir exists
          OUT_DIR="${{ steps.release_dir.outputs.release_dir }}/out"
          mkdir -p "$OUT_DIR"
          DEBUG_APK=$(find "$DEBUG_DIR" -maxdepth 1 -name "*.apk" | head -n 1 || true)
          if [ -z "$DEBUG_APK" ]; then DEBUG_APK=$(find app/build/outputs/apk -path "*/debug/*.apk" | head -n 1 || true); fi
          if [ -z "$DEBUG_APK" ] || [ ! -f "$DEBUG_APK" ]; then echo "Debug APK not found"; find app/build/outputs/apk -name "*.apk" | head -20; exit 1; fi
          cp "$DEBUG_APK" "$OUT_DIR/app-gms-mobile-universal-debug.apk"
          echo "Debug APK → $OUT_DIR/app-gms-mobile-universal-debug.apk"
  
      - name: VirusTotal scan (gate release on detections)
        if: env.VIRUSTOTAL_API_KEY != ''
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          vt_scan() {
            local APK="$1"
            local NAME=$(basename "$APK")
            local SHA=$(sha256sum "$APK" | awk '{print $1}')
            echo "=== VirusTotal: $NAME (SHA $SHA) ==="
            # 1. Try existing report
            HTTP=$(curl -s -w "%{http_code}" -o /tmp/vt_report.json --header "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/files/$SHA" || true)
            if echo "$HTTP" | grep -q "200"; then
              DETECT=$(python3 -c "import json; d=json.load(open('/tmp/vt_report.json')); print(d.get('data',{}).get('attributes',{}).get('last_analysis_stats',{}).get('malicious',0))" 2>/dev/null || echo "?")
              echo "VirusTotal detections for $NAME: $DETECT"
              echo "- $NAME: $DETECT detections — https://www.virustotal.com/gui/file/$SHA" >> "$GITHUB_STEP_SUMMARY"
              if [ "$DETECT" != "0" ] && [ "$DETECT" != "?" ]; then echo "::error::VirusTotal flagged $DETECT detections for $NAME — gating release"; exit 1; fi
              return 0
            fi
            echo "No prior report (HTTP $HTTP), uploading $NAME for scan..."
            # 2. Get upload URL (handles >32MB)
            UPLOAD_URL=$(curl -s --header "x-apikey: $VIRUSTOTAL_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('data','') or '')" 2>/dev/null || true)
            if [ -z "$UPLOAD_URL" ]; then UPLOAD_URL="https://www.virustotal.com/api/v3/files"; fi
            echo "Upload URL: $UPLOAD_URL"
            UPLOAD_JSON=$(curl -s --header "x-apikey: $VIRUSTOTAL_API_KEY" --form "file=@$APK" "$UPLOAD_URL" || true)
            echo "$UPLOAD_JSON" | head -c 800
            echo ""
            echo "$UPLOAD_JSON" > /tmp/vt_upload.json
            ANALYSIS_ID=$(python3 -c "import json; d=json.load(open('/tmp/vt_upload.json')); print(d.get('data',{}).get('id',''))" 2>/dev/null || true)
            if [ -z "$ANALYSIS_ID" ]; then
              echo "Upload may have returned file report directly (small file), checking files endpoint..."
              # fallback: poll files endpoint directly
            else
              echo "Analysis ID: $ANALYSIS_ID"
              # 3. Poll analysis until completed (max ~5m)
              for i in $(seq 1 20); do
                sleep 15
                curl -s --header "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" -o /tmp/vt_analysis.json || true
                STATUS=$(python3 -c "import json; d=json.load(open('/tmp/vt_analysis.json')); print(d.get('data',{}).get('attributes',{}).get('status',''))" 2>/dev/null || echo "")
                echo "Poll $i: status=$STATUS"
                if [ "$STATUS" = "completed" ]; then break; fi
              done
              cat /tmp/vt_analysis.json | head -c 800; echo ""
            fi
            # 4. Fetch final file report (may take a bit to appear after analysis)
            for i in $(seq 1 10); do
              HTTP2=$(curl -s -w "%{http_code}" -o /tmp/vt_report2.json --header "x-apikey: $VIRUSTOTAL_API_KEY" "https://www.virustotal.com/api/v3/files/$SHA" || true)
              if echo "$HTTP2" | grep -q "200"; then break; fi
              echo "File report not yet available (HTTP $HTTP2), retry $i..."
              sleep 10
            done
            if [ -f /tmp/vt_report2.json ]; then
              DETECT=$(python3 -c "import json; d=json.load(open('/tmp/vt_report2.json')); print(d.get('data',{}).get('attributes',{}).get('last_analysis_stats',{}).get('malicious',0))" 2>/dev/null || echo "?")
              echo "VirusTotal detections after upload for $NAME: $DETECT"
              echo "- $NAME: $DETECT detections — https://www.virustotal.com/gui/file/$SHA" >> "$GITHUB_STEP_SUMMARY"
              if [ "$DETECT" != "0" ] && [ "$DETECT" != "?" ]; then echo "::error::VirusTotal flagged $DETECT detections for $NAME — gating release"; exit 1; fi
            else
              echo "Uploaded $NAME — check https://www.virustotal.com/gui/file/$SHA (analysis pending, link may take 2-5m to become live)" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "Done scanning $NAME"
          }
          OUT_DIR="${{ steps.release_dir.outputs.release_dir }}/out"
          vt_scan "$OUT_DIR/${{ steps.variant.outputs.apk_name }}"
          vt_scan "$OUT_DIR/app-gms-mobile-universal-debug.apk"

      - name: Attest APK provenance (release)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}

      - name: Attest APK provenance (debug)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.release_dir.outputs.release_dir }}/out/app-gms-mobile-universal-debug.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: app-gms-mobile-universal
          path: |
            ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}
            ${{ steps.release_dir.outputs.release_dir }}/out/app-gms-mobile-universal-debug.apk

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Resolve changelog range
        id: changelog_range
        shell: bash
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            FROM_REF="$LAST_TAG"
          else
            FROM_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "from_ref=$FROM_REF" >> "$GITHUB_OUTPUT"
          echo "to_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.changelog_range.outputs.from_ref }}
          toTag: ${{ steps.changelog_range.outputs.to_ref }}
          configurationJson: |
            {
              "template": "# Changelog\n\n#{{CHANGELOG}}\n\n<details>\n<summary>Other changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n",
              "pr_template": "- #{{TITLE}} — by @#{{AUTHOR}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Performance", "labels": ["perf"] },
                { "title": "## Refactors", "labels": ["refactor"] },
                { "title": "## Documentation", "labels": ["docs"] },
                { "title": "## Build / CI", "labels": ["build", "ci"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?:\\s+.*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t APKS < <(find downloaded_artifacts -name "*.apk" | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then echo "No APK found"; find downloaded_artifacts -type f | head -20; exit 1; fi
          printf "Found APKs:\n"; printf " - %s\n" "${APKS[@]}"
          cat > release_notes.md <<EOF
          ${{ steps.build_changelog.outputs.changelog }}
          EOF
          # Append VirusTotal links (SHA-based, no API needed for link)
          {
            echo ""
            echo "---"
            echo "### VirusTotal"
            for apk in "${APKS[@]}"; do
              sha=$(sha256sum "$apk" | awk '{print $1}')
              name=$(basename "$apk")
              echo "- VirusTotal of $name: https://www.virustotal.com/gui/file/$sha"
            done
            echo ""
            echo "_VirusTotal scan via api/v3/files+analyses polled in build job (up to 5m) — links live when analysis completes._"
          } >> release_notes.md
          cat release_notes.md
          TAG="${{ needs.check-version.outputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v${{ needs.check-version.outputs.new_version }}-${GITHUB_SHA::7}"; fi
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" --notes-file release_notes.md "${APKS[@]}"
